name: Release

on:
  push:
    branches: [main]
    paths:
      - ".release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: operations-optimization-casebook-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            marker="$(find .release -maxdepth 1 -type f -name 'v*' | LC_ALL=C sort | tail -n1)"
            test -n "$marker"
            version="${marker##*/}"
          else
            version="$REQUESTED_VERSION"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 64
          package_version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit('package version not found')
          print(match.group(1))
          PY
          )"
          test "${version#v}" = "$package_version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "plain=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==82.0.1 wheel==0.46.3

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .

      - name: Run release gate
        run: make release-gate

      - name: Create or verify immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Build assets
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.plain }}
          SOURCE_DATE_EPOCH: "1788307200"
        run: |
          set -euo pipefail
          rm -rf release-dist build src/*.egg-info
          mkdir -p release-dist
          prefix="operations-optimization-casebook-${VERSION}/"
          git archive --format=tar --prefix="$prefix" "$TAG" | gzip -n > "release-dist/operations-optimization-casebook-${VERSION}.tar.gz"
          git archive --format=zip --prefix="$prefix" "$TAG" > "release-dist/operations-optimization-casebook-${VERSION}.zip"
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir release-dist .
          cp examples/synthetic-suite/expected/summary.json release-dist/REFERENCE_SUMMARY.json
          cp examples/synthetic-suite/expected/report.html release-dist/REFERENCE_REPORT.html
          cp examples/synthetic-suite/expected/decision-portfolio.csv release-dist/DECISION_PORTFOLIO.csv
          python - <<'PY'
          import json
          import os
          import unittest
          from pathlib import Path
          provenance = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'version': os.environ['TAG'],
              'commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'automated_tests': unittest.defaultTestLoader.discover('tests').countTestCases(),
              'reference_cases': 10,
              'stress_tests': 30,
              'reference_artifacts': 106,
              'maturity': 'public synthetic casebook validated',
              'execution_authority': 'not provided',
          }
          Path('release-dist/RELEASE_PROVENANCE.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          (cd release-dist && sha256sum * | LC_ALL=C sort > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Operations Optimization Casebook v0.1.0

          Ten exact small-instance reference models, thirty stress tests, baseline and implementation gates, 365 automated tests, deterministic evidence bundles, and deep rebuild verification.

          The public release is synthetic and educational. It does not authorize real operational, workforce, routing, inventory, facility, or capital-allocation decisions.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* --clobber
            gh release edit "$TAG" --title "Operations Optimization Casebook $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" release-dist/* --verify-tag --title "Operations Optimization Casebook $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
