name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: operations-optimization-casebook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==82.0.1 wheel==0.46.3

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Enforce test floor
        run: python scripts/verify_test_count.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release-gate:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==82.0.1 wheel==0.46.3

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .

      - name: Run complete repository gate
        run: make release-gate

  reproducible-wheel:
    name: Reproducible wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==82.0.1 wheel==0.46.3

      - name: Build twice with fixed epoch
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1788307200"
        run: |
          set -euo pipefail
          rm -rf wheel-a wheel-b build src/*.egg-info
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir wheel-a .
          rm -rf build src/*.egg-info
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir wheel-b .
          cmp wheel-a/*.whl wheel-b/*.whl
          sha256sum wheel-a/*.whl wheel-b/*.whl
